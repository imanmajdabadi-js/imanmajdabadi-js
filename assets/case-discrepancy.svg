    <path d="M16 102H160" stroke="#294348"/>
    <text x="16" y="124" fill="#91a4a3" class="mono" font-size="9" letter-spacing="1.3">STATUS</text>
    <rect x="108" y="111" width="52" height="20" rx="10" fill="none" stroke="#55c4b2"/>
    <text x="134" y="125" fill="#55c4b2" class="mono" font-size="9" letter-spacing="1.3" text-anchor="middle">REVIEW</text>
    <path d="M200 16V132" stroke="#294348" stroke-width="2"/>
    <circle cx="200" cy="24" r="4.5" fill="#ffb000"/>
