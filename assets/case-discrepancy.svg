    <text x="16" y="52" fill="#91a4a3" class="mono" font-size="9" letter-spacing="1.3">ITEMS SHORT</text>
    <text x="160" y="53" fill="#ffb000" class="mono" font-size="13" font-weight="700" text-anchor="end">-3</text>
    <path d="M16 66H160" stroke="#294348"/>
