  <text x="48" y="169" fill="#f3ebdc" class="sans" font-size="38" font-weight="760" letter-spacing="-1">ROOZ</text>
  <text x="48" y="207" fill="#91a4a3" class="sans" font-size="16">A Persian planner built around the solar Hijri calendar,</text>
  <text x="48" y="232" fill="#91a4a3" class="sans" font-size="16">with priorities, recurring tasks and labels — laid out</text>
  <text x="48" y="257" fill="#91a4a3" class="sans" font-size="16">as a star map instead of another flat list.</text>
  <text x="48" y="290" fill="#55c4b2" class="mono" font-size="10" letter-spacing="1.4">REACT · TYPESCRIPT · ZUSTAND · TAILWIND · THREE.JS</text>
