  <text x="176" y="169" fill="#91a4a3" class="sans" font-size="16">progress — routed screens over Redux Toolkit state and RTL Tailwind.</text>
  <text x="176" y="207" fill="#ffb000" class="mono" font-size="11" letter-spacing="1.7">REACT  ·  REDUX TOOLKIT  ·  TYPESCRIPT  ·  TAILWIND</text>
