<svg width="720" height="430" viewBox="0 0 720 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Delivery Discrepancy Manager</title>
  <desc id="desc">A role-based case-management system for post-delivery shortages and damage, with quantity validation and an immutable audit trail.</desc>
  <style>.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
  <rect width="720" height="430" rx="28" fill="#081416"/>
  <rect x="20" y="20" width="680" height="390" rx="20" fill="#0d1d20" stroke="#294348"/>
  <path d="M20 112H700M20 312H700" stroke="#294348"/>
  <text x="48" y="81" fill="#f3ebdc" class="mono" font-size="48" font-weight="700">03</text>
  <text x="150" y="59" fill="#ffb000" class="mono" font-size="11" letter-spacing="2.2">PROJECT NOTE</text>
  <text x="150" y="83" fill="#91a4a3" class="mono" font-size="11" letter-spacing="2.2">CASE MANAGEMENT / AUDIT TRAIL</text>
  <text x="48" y="169" fill="#f3ebdc" class="sans" font-size="38" font-weight="760" letter-spacing="-1">DISCREPANCY MANAGER</text>
  <text x="48" y="207" fill="#91a4a3" class="sans" font-size="16">A role-based case manager for shortages and damage</text>
  <text x="48" y="232" fill="#91a4a3" class="sans" font-size="16">found after delivery. Operators log the items,</text>
  <text x="48" y="257" fill="#91a4a3" class="sans" font-size="16">managers decide, and every action stays auditable.</text>
  <text x="48" y="290" fill="#55c4b2" class="mono" font-size="10" letter-spacing="1.4">REACT · NESTJS · POSTGRESQL · TYPESCRIPT</text>
  <g transform="translate(48 318)">
