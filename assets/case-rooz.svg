  <text x="176" y="105" fill="#f3ebdc" class="sans" font-size="38" font-weight="720" letter-spacing="-1">ROOZ</text>
  <text x="176" y="143" fill="#91a4a3" class="sans" font-size="16">A Persian planner built around the solar Hijri calendar — priorities,</text>
  <text x="176" y="169" fill="#91a4a3" class="sans" font-size="16">recurring tasks and labels, mapped as a star map instead of a flat list.</text>
  <text x="176" y="207" fill="#55c4b2" class="mono" font-size="11" letter-spacing="1.7">REACT  ·  TYPESCRIPT  ·  ZUSTAND  ·  TAILWIND  ·  THREE.JS</text>
